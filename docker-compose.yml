services:
  postgres:
    image: postgres:18.4
    container_name: gradelis-db
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: gradelis
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: gradelis_dev

      # Explicit data directory (recommended)
      PGDATA: /var/lib/postgresql/data

    volumes:
      - gradelis_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradelis -d gradelis_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gradelis_postgres_data:

#DATABASE_URL="postgresql://gradelis:your_secure_password@localhost:5433/gradelis_dev?schema=public"

